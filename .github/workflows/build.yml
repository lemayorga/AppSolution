name: Build & Publish App

on:
  workflow_dispatch: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  #AZURE_WEBAPP_NAME:  'demoAppGithub01'
  AZURE_WEBAPP_PACKAGE_PATCH: './publish'
jobs:
  publish:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore ./AppSolution.sln
      
    - name: Build
      run: otnet build  ./src/SG.API/SG.API.csproj  --configuration  Release --no-restore
      
