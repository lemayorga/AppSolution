name: dotnet package

on:
  workflow_dispatch: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  #AZURE_WEBAPP_NAME:  'demoAppGithub01'
  AZURE_WEBAPP_PACKAGE_PATCH: './publish'
jobs:
  publish:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Install dependencies
      run: dotnet restore ./AppSolution.sln
      
    - name: Build
      run: dotnet build  ./src/SG.API/SG.API.csproj  --configuration  Release --no-restore

    - name: Test with the dotnet CLI
      run: dotnet test -v:detailed --consoleLoggerParameters:ErrorsOnly  --no-build     
      
   # - name: Publish
      #run: dotnet publish  --configuration  Release --no-build --property:PublishDir='${{ env.AZURE_WEBAPP_PACKAGE_PATCH }}'
